name: 📑 Updating lists
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
      runs-on: ubuntu-latest
      environment: Tag and Release
      if: "!contains(github.event.head_commit.message, '[bot] - Update lists')"
      steps:
        - name: Checkout repo
          uses: actions/checkout@v2
          with:
           persist-credentials: false
           fetch-depth: 0

        - name: Use Node 18.x
          uses: actions/setup-node@v1
          with:
            node-version: 18.x

        - name: Install deps
          run: npm install

        - name: Build token lists
          run: node ./.github/scripts/generate-lists.mjs

        - name: Publish to IPFS
          run: PERSONAL_ACCESS_TOKEN=${{ secrets.FLEEK_PERSONAL_ACCESS_TOKEN }} PROJECT_ID=${{ secrets.FLEEK_PROJECT_ID }} node ./.github/scripts/push-to-ipfs.mjs

        - name: Stage files
          run: git add -u

        - name: Temporarily disable "include administrators" branch protection
          uses: benjefferies/branch-protection-bot@master
          if: always()
          with:
           access_token: ${{ secrets.ACCESS_TOKEN }}
           branch: ${{ github.event.repository.default_branch }}
           enforce_admins: false

        - name: Authenticate CI bot
          uses: actions/create-github-app-token@v3
          id: ci-bot
          with:
            client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
            private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
            permission-contents: write

        - name: Commit files
          uses: DataDog/commit-headless@567f7eedac58750aa573f48fd60cfe478abc65bd # action/v3.3.0
          with:
            command: commit
            token: ${{ steps.ci-bot.outputs.token }}
            branch: ${{ github.ref_name }}
            head-sha: ${{ github.sha }}
            message: "[bot] - Update lists"

        - name: Enable "include administrators" branch protection
          uses: benjefferies/branch-protection-bot@master
          if: always()  # Force to always run this step to ensure "include administrators" is always turned back on
          with:
            access_token: ${{ secrets.ACCESS_TOKEN }}
            owner: etherfuse
            repo: tokenAssets
            branch: ${{ github.event.repository.default_branch }}
            enforce_admins: true
